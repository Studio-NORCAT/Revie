# Builds Revie and produces the WiX installer (MSI + bootstrapper EXE).
# Local equivalents of these steps are documented in README.md
# ("Build and Run", "Test", "Package Installer").

name: Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  CONFIGURATION: Release
  # Pinned: WiX 7+ requires accepting the Open Source Maintenance Fee EULA,
  # which breaks unattended CI. 6.0.2 supports the v4 schema used in packaging/.
  WIX_VERSION: 6.0.2

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore Revie.sln

    - name: Build
      run: dotnet build Revie.sln -c $env:CONFIGURATION --no-restore

    - name: Run tests
      run: dotnet test Revie.sln -c $env:CONFIGURATION --no-build --logger trx --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore

    - name: Publish self-contained app
      run: dotnet publish Revie.App/Revie.App.csproj -c $env:CONFIGURATION -r win-x64 --self-contained true -o dist/publish/installer-win-x64

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix --version $env:WIX_VERSION
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

    - name: Add WiX bootstrapper extension
      run: wix extension add "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"

    - name: Build MSI package
      run: wix build packaging/RevieInstaller.wxs -d SourceDir="$env:GITHUB_WORKSPACE/dist/publish/installer-win-x64" -o dist/Revie-Installer.msi

    - name: Build installer bundle
      run: wix build packaging/RevieBundle.wxs -d MsiPath="$env:GITHUB_WORKSPACE/dist/Revie-Installer.msi" -ext WixToolset.BootstrapperApplications.wixext -o dist/Revie-Installer.exe

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: Revie-Installer
        path: |
          dist/Revie-Installer.exe
          dist/Revie-Installer.msi
        retention-days: 14

    - name: Upload portable build
      uses: actions/upload-artifact@v7
      with:
        name: Revie-portable-win-x64
        path: dist/publish/installer-win-x64
        retention-days: 14
